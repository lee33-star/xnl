<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장르별 게임 추천 서비스</title>
  <style>
    /* 기본 스타일 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    header p {
      color: #94a3b8;
    }

    /* 장르 선택 버튼 구역 */
    .genre-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 900px;
      margin-bottom: 40px;
    }

    .genre-btn {
      background-color: #1e293b;
      color: #cbd5e1;
      border: 2px solid #334155;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .genre-btn:hover {
      background-color: #334155;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .genre-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .random-btn {
      background-color: #a855f7;
      border-color: #a855f7;
      color: #ffffff;
    }

    .random-btn:hover {
      background-color: #9333ea;
      border-color: #9333ea;
    }

    /* 게임 카드 목록 구역 */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1100px;
    }

    .game-card {
      background-color: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
    }

    .game-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-badge {
      align-self: flex-start;
      background-color: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .card-desc {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      color: #64748b;
      font-size: 1.1rem;
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 게임 취향 추천소</h1>
    <p>원하는 장르를 선택하면 어울리는 게임을 추천해 드립니다.</p>
  </header>

  <!-- 장르 버튼 목록 -->
  <div class="genre-container">
    <button class="genre-btn active" onclick="selectGenre('전체', this)">전체보기</button>
    <button class="genre-btn" onclick="selectGenre('RPG', this)">🛡️ RPG</button>
    <button class="genre-btn" onclick="selectGenre('액션', this)">⚔️ 액션</button>
    <button class="genre-btn" onclick="selectGenre('FPS/슈팅', this)">🎯 FPS/슈팅</button>
    <button class="genre-btn" onclick="selectGenre('힐링/시뮬', this)">🌱 힐링/시뮬레이션</button>
    <button class="genre-btn" onclick="selectGenre('전략', this)">🧠 전략</button>
    <button class="genre-btn random-btn" onclick="pickRandomGame()">🎲 랜덤 1개 추천</button>
  </div>

  <!-- 게임 결과 출력 영역 -->
  <main class="game-grid" id="gameGrid">
    <!-- 자바스크립트로 카드가 자동 생성됩니다 -->

    // 화면에 게임 카드 목록을 출력하는 함수
    function renderGames(list) {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = `<div class="empty-message">해당 장르의 추천 게임이 없습니다.</div>`;
        return;
      }

      list.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${game.image}" alt="${game.title}">
          <div class="card-content">
            <span class="card-badge">${game.genre}</span>
            <h3 class="card-title">${game.title}</h3>
            <p class="card-desc">${game.desc}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 장르 선택 처리 함수
    function selectGenre(genre, button) {
      // 모든 버튼 활성화 해제 후 클릭한 버튼만 활성화
      const buttons = document.querySelectorAll('.genre-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');

      if (genre === '전체') {
        renderGames(gameList);
      } else {
        const filtered = gameList.filter(game => game.genre === genre);
        renderGames(filtered);
      }
    }

    // 랜덤 게임 1개 선택 기능
    function pickRandomGame() {
      const buttons = document.querySelectorAll('.genre-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      const randomIndex = Math.floor(Math.random() * gameList.length);
      const selectedGame = [gameList[randomIndex]];
      
      renderGames(selectedGame);
    }

    // 처음 페이지 로드 시 전체 게임 표시
    renderGames(gameList);
  </script>

</html>
